<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon</title>
<link rel="icon" href="data:,">
<style>
  /* The Mojang Studios red (overlay.js) from the first paint. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: rgb(239, 50, 61); }
  /* winit sizes the canvas inline; the page decides. */
  /* touch-action: fingers reach the game (touch.rs), not the page's scrolling and zoom. */
  canvas { display: block; width: 100vw !important; height: 100vh !important; outline: none;
    touch-action: none; }
  /* Vanilla's Mojang Studios screen (overlay.js) over the game's canvas. */
  canvas.horizon-overlay { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  /* Once the overlay is gone, nothing red behind the game's canvas. */
  html.horizon-running, html.horizon-running body { background: #000; }
  /* main.js: the game stopped. */
  .horizon-stopped { position: fixed; inset: auto 0 40%; z-index: 2; padding: 16px; text-align: center;
    color: #fff; background: rgba(0, 0, 0, 0.75); font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<script type="module">
import { requireBrowserFeatures, showFailure } from './startup.js';
try {
    requireBrowserFeatures();
    // Catch every bootstrap failure, including GPU/device and module-import errors, not only
    // Wasm traps. Otherwise the Mojang overlay stays on screen with no explanation.
    await import('./main.js');
} catch (error) {
    showFailure(error);
}
</script>
</body>
</html>
